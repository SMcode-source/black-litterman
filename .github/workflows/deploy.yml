name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 23:00 UTC on weekdays -- comfortably after the US close, so each run
    # picks up a complete trading day.
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Yahoo Finance snapshot -------------------------------------
      # Yahoo serves no CORS headers, so the browser cannot call it. We fetch
      # here instead and ship the result as a static asset. If this step fails
      # the whole job fails by design: better to keep the last good deploy
      # serving real data than to publish an app with no universe to optimise.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-pipeline/requirements.txt

      - name: Install data pipeline dependencies
        run: pip install -r data-pipeline/requirements.txt

      - name: Fetch S&P 500 snapshot from Yahoo Finance
        run: python data-pipeline/fetch_equity_data.py --out app/public/data

      - name: Show snapshot summary
        run: |
          ls -lh app/public/data
          python -c "import json;m=json.load(open('app/public/data/equity_universe.json'))['meta'];print(m)"

      # ---- engine checks ----------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Verify the optimiser against the fresh snapshot
        run: node data-pipeline/check_engine.mjs

      # ---- build -------------------------------------------------------
      - name: Install app dependencies
        working-directory: app
        run: npm ci

      # No backend URL is configured because there is nothing to configure:
      # the app solves in the browser and makes no API call, so the published
      # site is self-contained.
      - name: Build app
        working-directory: app
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp -r app/dist _site/app
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
